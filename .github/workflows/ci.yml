name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"      # nightly: catch upstream SDK / API drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (pinned, ${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (SDK versions the integration tests are verified against)
        run: pip install -e ".[test,toml]"
      - name: Install Aegis (the governance tests need it)
        run: pip install "aegis-kernel>=0.4.0"
      - name: Test
        run: python -m unittest discover tests -v

  postgres:
    # The whole suite with the store in Postgres (psycopg 3), plus tests/test_postgres.py: every console route
    # answering the same on SQLite and Postgres, the SQL dialect probes, and two instances sharing a schema.
    name: postgres (whole suite, psycopg 3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ad
          POSTGRES_PASSWORD: ad-ci
          POSTGRES_DB: ad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ad -d ad" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      AGENTDYNAMICS_DB_URL: postgresql://ad:ad-ci@127.0.0.1:5432/ad
      AGENTDYNAMICS_DB_SCHEMA: "t_{data_dir}"          # a schema per test store
      AGENTDYNAMICS_TEST_PG_URL: postgresql://ad:ad-ci@127.0.0.1:5432/ad
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,toml,postgres]" && pip install "aegis-kernel>=0.4.0"
      - name: Test
        run: python -m unittest discover tests -v

  ecosystem:
    name: ecosystem (latest releases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the newest LangGraph, LangSmith, OpenTelemetry, OpenInference, Anthropic, OpenAI
        run: |
          pip install -e ".[toml]"
          pip install --upgrade langgraph langchain-core langsmith opentelemetry-sdk \
            opentelemetry-exporter-otlp-proto-http openinference-instrumentation-langchain anthropic openai
          pip install "aegis-kernel>=0.4.0"
          pip list | grep -iE "langgraph|langchain-core|langsmith|opentelemetry-sdk|openinference-instrumentation-langchain|anthropic|openai|zstandard"
      - name: Test
        run: python -m unittest discover tests -v

  package:
    # Build the wheel and check the *installed* package has every file the console loads. Tests run from
    # the source tree and can't see a file the wheel leaves out.
    name: package (installed wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - name: Every file index.html loads is in the wheel
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/v/bin/python "$GITHUB_WORKSPACE/.github/check_installed.py"

  scaling:
    # Cost must grow linearly with the store. Measured as time(4k tasks) / time(1k) in one process,
    # so runner speed cancels out; an O(n^2) path shows up as ~16x (bench/bench.py explains the gate).
    name: scaling (bench --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Refresh cost grows linearly with the number of tasks
        run: python -u bench/bench.py --check

  live:
    name: live Anthropic API smoke test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . anthropic
      - name: Smoke test (skips when the ANTHROPIC_API_KEY secret is not configured)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENTDYNAMICS_LIVE: "1"
        run: python -m unittest tests.test_live_anthropic -v
