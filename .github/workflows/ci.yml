name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (SDK versions the integration tests are verified against)
        run: pip install -e ".[test,toml]"
      - name: Install Aegis (observe + reserve_spend are on main, not yet on PyPI)
        run: pip install "aegis-guard @ git+https://github.com/Aditya31398/aegis.git@main"
      - name: Test
        run: python -m unittest discover tests -v
