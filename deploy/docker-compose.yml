# AgentDynamics + an OpenTelemetry Collector gateway.
#
#   AGENTDYNAMICS_API_KEYS="collector:<ingest-key>:ingest,sre:<read-key>:read,admin:<admin-key>:admin" \
#   AGENTDYNAMICS_INGEST_KEY=<ingest-key> docker compose -f deploy/docker-compose.yml up -d
#
# Apps send OTLP to the collector (4317 gRPC / 4318 HTTP); LangChain/LangGraph apps can instead
# point LANGSMITH_ENDPOINT at http://<host>:8787/langsmith.
services:
  agentdynamics:
    build: ..
    ports: ["8787:8787"]
    environment:
      AGENTDYNAMICS_API_KEYS: ${AGENTDYNAMICS_API_KEYS:?set API keys}
      AGENTDYNAMICS_RETENTION_DAYS: "90"
    volumes:
      - agentdynamics-data:/data
      - ./agentdynamics.toml:/data/agentdynamics.toml:ro
      # - ./agent-traces:/var/log/agent-traces:ro     # inbox source for log shippers / S3 sync
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    environment:
      AGENTDYNAMICS_INGEST_KEY: ${AGENTDYNAMICS_INGEST_KEY:?set ingest key}
    ports: ["4317:4317", "4318:4318"]
    depends_on: [agentdynamics]
    restart: unless-stopped

volumes:
  agentdynamics-data:
