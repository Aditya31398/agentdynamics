# Production configuration example. Mounted at /data/agentdynamics.toml in the container.
# API keys are better supplied via AGENTDYNAMICS_API_KEYS than written here.

[server]
host = "0.0.0.0"
port = 8787
# tls_cert = "/data/tls/cert.pem"   # serve HTTPS itself; or terminate TLS in a proxy and keep this port private
# tls_key = "/data/tls/key.pem"

[auth]
enabled = true

# People sign in with your identity provider (OpenID Connect). Register
# https://agentdynamics.example.com/auth/callback as the redirect URI.
# [auth.oidc]
# issuer = "https://login.example.com"
# client_id = "agentdynamics"
# client_secret_env = "AGENTDYNAMICS_OIDC_SECRET"
# redirect_url = "https://agentdynamics.example.com/auth/callback"
#
# [[auth.access]]                    # the first rule that matches gives the role; nobody else gets in
# match = "group:platform"
# role = "admin"
# [[auth.access]]
# match = "*@example.com"
# role = "read"

# The store: the SQLite file on the data volume by default. For several instances or managed backups, point
# it at Postgres (the image includes the driver). AGENTDYNAMICS_DB_URL keeps the password out of this file.
# [store]
# url = "postgresql://agentdynamics@db.internal/agentdynamics"
# schema = "agentdynamics"

[privacy]
store_content = true
redact = ["email", "api_key", "credit_card", "bearer", "aws_key"]
extra_patterns = ['\b\d{3}-\d{2}-\d{4}\b']      # e.g. US SSNs

[retention]
days = 90          # raw spans and runs; daily totals are kept past it (docs/ARCHITECTURE.md)

[analysis]
interval = 15

# [alerts]
# console_url = "https://agentdynamics.example.com"   # alerts link back to the task or SLO
#
# [[alerts.webhooks]]
# url = "https://hooks.slack.com/services/T000/B000/XXXX"
# min_severity = "warning"
# format = "slack"                 # slack | pagerduty | json
# kinds = ["events", "slos"]       # health-rule events, SLO burn-rate alerts
#
# [[alerts.webhooks]]
# name = "pager"
# format = "pagerduty"
# routing_key_env = "PD_ROUTING_KEY"
# min_severity = "critical"
# kinds = ["slos"]

# Pull from an existing LangSmith project (keeps LangSmith as the system of record)
# [[sources]]
# type = "langsmith_api"
# project = "support-bot-prod"
# api_key_env = "LANGSMITH_API_KEY"
# interval = 60

# Pull from Langfuse
# [[sources]]
# type = "langfuse_api"
# host = "https://cloud.langfuse.com"
# public_key_env = "LANGFUSE_PUBLIC_KEY"
# secret_key_env = "LANGFUSE_SECRET_KEY"

# Tail JSONL written by Fluent Bit / Vector / S3 sync
# [[sources]]
# type = "inbox"
# path = "/var/log/agent-traces"
